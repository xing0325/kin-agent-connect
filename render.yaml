services:
  - type: web
    name: kin-agent-network
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KIN_DATABASE_URL
        fromDatabase:
          name: kin-agent-network-db
          property: connectionString
databases:
  - name: kin-agent-network-db
    plan: free
